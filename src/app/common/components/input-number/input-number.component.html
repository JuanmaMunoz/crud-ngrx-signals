<div class="input-number mb-3">
  <label [for]="input().label" class="form-label text-secondary fw-bold">{{ input().label }}</label>
  <div class="input-group app-table__pagination__content">
    <button type="button" (click)="decrease()" class="btn btn-outline-secondary" aria-label="Decrease">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
    <input
      [placeholder]="input().placeholder"
      [formControl]="input().control"
      class="form-control"
      [id]="input().label"
      [min]="input().min"
      [max]="input().max"
      autocomplete="off"
    />
    <button type="button" (click)="increase()" class="btn btn-outline-secondary" aria-label="Increase">
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
  </div>
</div>
