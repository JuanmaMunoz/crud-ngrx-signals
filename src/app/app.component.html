@defer (on viewport) {
  <div [@scaleFadeIn] class="app px-2">
    <app-header />
    <main class="container" [class.container--active]="loginSuccess()">
      <router-outlet />
    </main>
  </div>
  <app-modal-error [(openModal)]="showErrorModal" [errorMessage]="errorMessage()" />
  @if (messageError()) {
    <app-error />
  }
} @placeholder {
  <div class="mt-5 p-5"><app-spinner /></div>
}
